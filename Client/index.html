<!DOCTYPE html>
<html>
<head>
  <title>Realtime Collaborative Canvas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">
    <h2>🎨 Realtime Collaborative Canvas</h2>

    <div class="toolbar">
  <label>
    Color:
    <input type="color" id="colorPicker" value="#000000">
  </label>

  <label>
    Thickness:
    <input type="range" id="thickness" min="1" max="10" value="2">
  </label>

  <label>
    <input type="checkbox" id="themeToggle">
    Dark
  </label>
</div>


    <canvas id="canvas" width="700" height="400"></canvas>

    <div class="hint">
      Open this page in multiple tabs to see real-time drawing
    </div>
  </div>

  <script src="websocket.js"></script>
  <script src="canvas.js"></script>
</body>
</html>
